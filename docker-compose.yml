version: '3.8'
services:
  db:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - db_data:/data/db
    networks:
      - pokemon_network

  mongo-express:
    image: mongo-express:latest
    container_name: mongo_express
    restart: on-failure
    depends_on:
      - db
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://db:27017/
    networks:
      - pokemon_network

  app:
    build: .
    container_name: pokemon_app
    environment:
      - MONGO_URL=mongodb://db:27017/PokemonDB
    ports:
      - "3000:3000"
    networks:
      - pokemon_network

volumes:
  db_data:

networks:
  pokemon_network:
    driver: bridge