version: '3.8'
services:

  db:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - db_data:/data/db
    networks:
      - pokemon_network
  app:
    build: .
    ports:
      - "3000:8080"
    networks:
      - pokemon_network

volumes:
  db_data:

networks:
  pokemon_network:
    driver: bridge